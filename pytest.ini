[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
filterwarnings =
    # FastAPI 0.115 строит TypeAdapter по полю с alias — новые pydantic на это
    # предупреждают; на валидацию не влияет (pointId принимается, см. тесты выдач).
    ignore::pydantic.warnings.UnsupportedFieldAttributeWarning
